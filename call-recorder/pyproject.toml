[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "callrec"
version = "0.1.0"
description = "Lokaler Gesprächsrekorder für Teams-Anrufe mit Transkript, Sprechererkennung und Zusammenfassung (Windows 11)"
readme = "README.md"
requires-python = ">=3.12"  # numpy 2.5.x has no wheels for 3.11
license = { text = "Proprietary / private use" }
# Exact pins live in requirements.txt (runtime, Windows) and
# requirements-dev.txt; these are the same pins so `pip install .` is reproducible.
dependencies = [
    "numpy==2.5.5",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "faster-whisper==1.2.1",
    "av==18.1.0",  # av 19 dropped open(metadata_errors=...) used by faster-whisper 1.2.1
    "ctranslate2==4.9.0",
    "sherpa-onnx==2.0.1",
    "msal==1.39.0",
    "msal-extensions==1.3.1",
    "requests==2.34.2",
    "anthropic==2.10.0",  # optional cloud summary provider (Claude), see README
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "tomli-w==1.2.0",
    "psutil==7.2.2",
    "Pillow==13.0.0",
    "pystray==0.19.5",
    "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'",
    "pycaw==20260927; sys_platform == 'win32'",
    "comtypes==1.5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
cuda = [
    # Must match the cudnn64_9.dll bundled in the ctranslate2 4.9.0 Windows wheel (9.10.2.21).
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.9.1.4; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'win32'",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pyflakes==4.1.0",
]

[project.scripts]
callrec = "callrec.cli:main"

[project.gui-scripts]
callrec-tray = "callrec.cli:main_tray"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["callrec"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
